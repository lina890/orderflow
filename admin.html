<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrderFlow - لوحة البائع</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#fbf6ef;color:#3b2f33}
.wrap{max-width:700px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
h1,h2{color:#c05d77}
input,select,textarea{width:100%;padding:12px;margin:5px 0 12px;border:1px solid #eadde0;border-radius:10px;font:inherit}
button,.btn{border:0;border-radius:10px;padding:11px 16px;background:#d9768f;color:white;font-weight:bold;cursor:pointer}
.alt{background:#fbe9ee;color:#c05d77}
.del{background:#fdecec;color:#cf4a4a}
.row{display:flex;gap:8px;flex-wrap:wrap}
.order{border:1px solid #f0e4e0;border-radius:14px;padding:14px;margin:10px 0}
.badge{padding:4px 9px;border-radius:20px;font-size:12px}
.pending{background:#fff3da;color:#a66b00}
.confirmed{background:#e3f5ec;color:#27734d}
.canceled{background:#fdecec;color:#b33}
.stat{display:inline-block;width:48%;vertical-align:top}
.small{font-size:13px;color:#8a7a7e}
.hidden{display:none}
</style>
</head>

<body>
<div class="wrap">

<header class="card">
<h1>🌸 OrderFlow</h1>
<div id="userInfo" class="small"></div>
<button id="logout" class="alt" onclick="logout()" style="display:none">خروج</button>
</header>

<div id="app"></div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
doc,
getDoc,
setDoc,
updateDoc,
deleteDoc,
onSnapshot,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyDeraZUAeX2nqTrzGBxU5NQEioyQ4vx38Y",
authDomain:"rderflow-ba3af.firebaseapp.com",
projectId:"rderflow-ba3af",
storageBucket:"rderflow-ba3af.firebasestorage.app",
messagingSenderId:"520695536117",
appId:"1:520695536117:web:a848469f6013c21d6ca8bc"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let orders=[];
let seller=null;
let unsubscribe=null;
let signupMode=false;


function appHTML(html){
document.getElementById("app").innerHTML=html;
}


function loginPage(){

appHTML(`
<div class="card">
<h2>${signupMode?"إنشاء حساب بائع":"دخول البائع"}</h2>

${signupMode?`
<label>اسم المتجر</label>
<input id="store" placeholder="اسم متجرك">
`:``}

<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="example@email.com">

<label>كلمة السر</label>
<input id="password" type="password" placeholder="6 أحرف على الأقل">

<button onclick="authAction()">
${signupMode?"إنشاء الحساب":"دخول"}
</button>

<p>
<button class="alt" onclick="signupMode=!signupMode;loginPage()">
${signupMode?"لدي حساب بالفعل":"بائع جديد؟ إنشاء حساب"}
</button>
</p>

<div id="error" class="small"></div>
</div>
`);
}


window.authAction=async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const error=document.getElementById("error");

try{

if(signupMode){

const store=document.getElementById("store").value.trim();

if(!store){
error.textContent="اكتبي اسم المتجر";
return;
}

const result=await createUserWithEmailAndPassword(
auth,email,password
);

await setDoc(
doc(db,"sellers",result.user.uid),
{storeName:store}
);

}else{

await signInWithEmailAndPassword(
auth,email,password
);

}

}catch(e){

error.textContent=
e.code==="auth/email-already-in-use"
?"هذا البريد مسجل من قبل"
:"البريد أو كلمة السر غير صحيحة";

}

};


window.logout=()=>signOut(auth);


function dashboard(){

const pending=orders.filter(x=>x.status==="pending").length;
const confirmed=orders.filter(x=>x.status==="confirmed").length;
const canceled=orders.filter(x=>x.status==="canceled").length;

appHTML(`

<h2>لوحة التحكم</h2>

<div class="card stat">
<b>${orders.length}</b>
<div class="small">كل الطلبات</div>
</div>

<div class="card stat">
<b>${pending}</b>
<div class="small">قيد التأكيد</div>
</div>

<div class="card stat">
<b>${confirmed}</b>
<div class="small">مؤكدة</div>
</div>

<div class="card stat">
<b>${canceled}</b>
<div class="small">ملغاة</div>
</div>

<div class="card">
<h3>آخر الطلبات</h3>
${orders.length?
orders.slice(0,10).map(orderHTML).join("")
:"<p class='small'>لا توجد طلبات بعد.</p>"}
</div>

<div class="card">
<button onclick="showOrders()">📋 جميع الطلبات</button>
<button class="alt" onclick="settings()">⚙️ إعدادات المتجر</button>
</div>

`);

}


function orderHTML(o){

let status=o.status||"pending";

let text={
pending:"قيد التأكيد",
confirmed:"مؤكد",
canceled:"ملغى"
}[status]||status;

return `
<div class="order">

<div>
<b>${escapeHTML(o.name||"بدون اسم")}</b>
<span class="badge ${status}">${text}</span>
</div>

<p>📞 ${escapeHTML(o.phone||"")}</p>
<p>📍 ${escapeHTML(o.wilaya||"")}</p>
<p>🛍️ ${escapeHTML(o.product||"")}</p>
<p>🔢 الكمية: ${o.qty||1}</p>

${o.address?`<p>🏠 ${escapeHTML(o.address)}</p>`:""}

<div class="row">

<button onclick="changeStatus('${o.id}','confirmed')">
تأكيد
</button>

<button class="alt" onclick="changeStatus('${o.id}','pending')">
قيد التأكيد
</button>

<button class="del" onclick="changeStatus('${o.id}','canceled')">
إلغاء
</button>

<button class="del" onclick="deleteOrder('${o.id}')">
حذف
</button>

</div>

</div>
`;
}


window.showOrders=()=>{

appHTML(`
<h2>📋 الطلبات</h2>

<div class="card">

<input
id="search"
placeholder="ابحثي باسم الزبون أو الهاتف"
oninput="filterOrders()"
>

<div id="ordersList">
${orders.length?
orders.map(orderHTML).join("")
:"<p class='small'>لا توجد طلبات.</p>"}
</div>

</div>

<button class="alt" onclick="dashboard()">رجوع</button>
`);

};


window.filterOrders=()=>{

const q=document.getElementById("search").value.toLowerCase();

const result=orders.filter(o=>
(o.name||"").toLowerCase().includes(q)||
(o.phone||"").includes(q)
);

document.getElementById("ordersList").innerHTML=
result.length?
result.map(orderHTML).join("")
:"<p class='small'>لا توجد نتائج.</p>";

};


window.changeStatus=async(id,status)=>{

try{

await updateDoc(
doc(db,"orders",id),
{status:status}
);

}catch(e){

alert("تعذر تحديث الطلب");

}

};


window.deleteOrder=async id=>{

if(!confirm("هل تريدين حذف هذا الطلب؟"))return;

try{

await deleteDoc(doc(db,"orders",id));

}catch(e){

alert("تعذر حذف الطلب");

}

};


function settings(){

const link=
location.origin+
location.pathname.replace("admin.html","")+
"?s="+seller.uid;

appHTML(`

<h2>⚙️ إعدادات المتجر</h2>

<div class="card">

<p>رابط الطلبات الخاص بمتجرك:</p>

<input
readonly
value="${link}"
onclick="this.select()"
>

<button onclick="copyLink('${link}')">
نسخ الرابط
</button>

</div>

<button class="alt" onclick="dashboard()">رجوع</button>

`);

}


window.copyLink=async link=>{

try{

await navigator.clipboard.writeText(link);
alert("تم نسخ الرابط ✅");

}catch(e){

alert("حددي الرابط وانسخيه يدوياً");

}

};


function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


onAuthStateChanged(auth,async user=>{

if(unsubscribe){
unsubscribe();
unsubscribe=null;
}

if(!user){

seller=null;
document.getElementById("logout").style.display="none";
document.getElementById("userInfo").textContent="";
loginPage();
return;

}

seller=user;

document.getElementById("logout").style.display="inline-block";
document.getElementById("userInfo").textContent=
user.email;

const q=query(
collection(db,"orders"),
where("sellerId","==",user.uid)
);

unsubscribe=onSnapshot(q,snapshot=>{

orders=snapshot.docs
.map(d=>({id:d.id,...d.data()}))
.sort((a,b)=>
String(b.date||"").localeCompare(String(a.date||""))
);

dashboard();

});

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrderFlow - البائع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 1) التصميم: الألوان والخط في مكان واحد، غيّريها بسهولة ===== */
:root{--pink:#d9768f;--pink-d:#c05d77;--pink-l:#fbe9ee;--cream:#fbf6ef;--card:#fff;--ink:#3b2f33;--mute:#8a7a7e;--line:#f0e4e0;--ok:#3f9b6b;--warn:#c98a1b;--bad:#cf4a4a}
*{box-sizing:border-box;margin:0}
body{font-family:'Tajawal',Tahoma,Arial,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:84px;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.logo{font-weight:700;font-size:20px;color:var(--pink-d)}
h2{font-size:20px;margin:6px 0 14px}
h3{font-size:16px;margin-bottom:10px}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(120,70,80,.07);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .n{font-size:26px;font-weight:700;color:var(--pink-d)}
.stat .l{font-size:13px;color:var(--mute)}
.btn{display:inline-block;border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--pink);color:#fff}
.btn:hover{background:var(--pink-d)}
.btn.alt{background:var(--pink-l);color:var(--pink-d)}
.btn.del{background:#fdecec;color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-p{background:#fff3da;color:var(--warn)}.b-c{background:#e3f5ec;color:var(--ok)}.b-x{background:#fdecec;color:var(--bad)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mute);font-weight:500;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line)}
tr.go{cursor:pointer}tr.go:hover{background:var(--pink-l)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pink-l);border-color:var(--pink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:block}
.item .top{display:flex;justify-content:space-between;gap:8px}
.item .sub{font-size:13px;color:var(--mute)}
dl{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:15px}
dt{color:var(--mute)}dd{margin:0}
.chart{width:100%;height:auto;direction:ltr}
.bar{margin-bottom:10px;font-size:14px}
.bar i{display:block;height:8px;border-radius:9px;background:var(--pink);margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:24px}
nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 10px}
nav a{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute);gap:2px;min-width:64px}
nav a b{font-size:20px;line-height:1}
nav a.on{color:var(--pink-d);font-weight:700}
@media(min-width:700px){.grid.four{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="wrap"><a href="#/" class="logo">OrderFlow 🌸</a><div class="row"><a href="#/new" class="btn sm">+ طلب جديد</a><button id="lo" class="btn alt sm" style="display:none" onclick="DB.logout()">خروج</button></div></div></header>
<main class="wrap" id="app"></main>
<nav id="nav"></nav>

<script>
/* ===== 2) البيانات: كل الطلبات تُحفظ في متصفحك (Local Storage) ===== */
const KEY = 'orderflow_orders_v2';
const CUR = 'دج';                       // غيّري العملة من هنا
const ST = {pending:['قيد التأكيد','b-p'], confirmed:['مؤكد','b-c'], canceled:['ملغى','b-x']};
const WILAYAS = 'الجزائر,وهران,قسنطينة,عنابة,سطيف,البليدة,باتنة,بجاية,تيزي وزو,تلمسان,بسكرة,ورقلة,مستغانم,الشلف,جيجل,سكيكدة,المسيلة,غرداية,بومرداس,تيبازة'.split(',');

let orders = [], user = null, ready = false;
function onAuth(u){ user=u; ready=true; document.getElementById('lo').style.display=u?'':'none'; route(); }
function onOrders(l){ orders=l; const p=(location.hash.slice(2)||'').split('/')[0]; if(ready&&user&&p!=='new'&&p!=='edit') route(); }

/* ===== 3) أدوات صغيرة ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('en-US');
const total = o => o.price*o.qty + o.delivery;
const find = id => orders.find(o => o.id===id);
const isToday = o => new Date(o.date).toDateString() === new Date().toDateString();
const badge = s => `<span class="badge ${ST[s][1]}">${ST[s][0]}</span>`;
const fdate = iso => new Date(iso).toLocaleDateString('ar-DZ',{day:'numeric',month:'long',year:'numeric'});
const count = s => orders.filter(o => o.status===s).length;

/* ===== 4) الصفحات: كل صفحة دالة ترجع HTML ===== */
function pageDashboard(){
  const t = orders.filter(isToday);
  const last = [...orders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  return `
  <div class="between"><h2>لوحة التحكم</h2></div>
  <div class="grid four">
    <div class="card stat"><div class="n">${t.length}</div><div class="l">طلبات اليوم</div></div>
    <div class="card stat"><div class="n">${count('confirmed')}</div><div class="l">مؤكدة</div></div>
    <div class="card stat"><div class="n">${count('pending')}</div><div class="l">قيد التأكيد</div></div>
    <div class="card stat"><div class="n">${count('canceled')}</div><div class="l">ملغاة</div></div>
  </div>
  <a href="#/new" class="btn" style="display:block;text-align:center;margin-bottom:14px">+ إضافة طلب جديد</a>
  <div class="card"><div class="between"><h3>آخر الطلبات</h3><a href="#/orders" class="btn alt sm">عرض الكل</a></div>
  ${last.length ? `<div class="tbl"><table><tr><th>الزبون</th><th>المنتج</th><th>الحالة</th><th>الإجمالي</th></tr>
  ${last.map(o=>`<tr class="go" onclick="location.hash='#/order/${o.id}'"><td>${esc(o.name)}</td><td>${esc(o.product)}</td><td>${badge(o.status)}</td><td>${fmt(total(o))} ${CUR}</td></tr>`).join('')}</table></div>` : '<div class="empty">لا توجد طلبات بعد</div>'}
  </div>`;
}

function pageForm(id){
  const o = id ? find(id) : null;
  if(id && !o) return '<div class="empty">الطلب غير موجود</div>';
  const v = (k,d='') => esc(o ? o[k] : d);
  return `
  <h2>${o?'تعديل الطلب':'إضافة طلب جديد'}</h2>
  <form class="card" onsubmit="return saveOrder(event,'${o?o.id:''}')">
    <label>اسم الزبون *</label><input name="name" required value="${v('name')}">
    <label>رقم الهاتف *</label><input name="phone" required inputmode="tel" value="${v('phone')}">
    <div class="two">
      <div><label>الولاية *</label><input name="wilaya" required list="wl" value="${v('wilaya')}"><datalist id="wl">${WILAYAS.map(w=>`<option value="${w}">`).join('')}</datalist></div>
      <div><label>حالة الطلب</label><select name="status">${Object.entries(ST).map(([k,[t]])=>`<option value="${k}" ${(o?o.status:'pending')===k?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <label>العنوان</label><input name="address" value="${v('address')}">
    <label>اسم المنتج *</label><input name="product" required value="${v('product')}">
    <div class="two">
      <div><label>الكمية *</label><input name="qty" type="number" min="1" required value="${v('qty',1)}"></div>
      <div><label>سعر المنتج (${CUR}) *</label><input name="price" type="number" min="0" required value="${v('price')}"></div>
      <div><label>سعر التوصيل (${CUR})</label><input name="delivery" type="number" min="0" value="${v('delivery',0)}"></div>
      <div><label>تكلفة المنتج (اختياري)</label><input name="cost" type="number" min="0" placeholder="لحساب الربح" value="${v('cost')}"></div>
    </div>
    <label>ملاحظات</label><textarea name="notes" rows="3">${v('notes')}</textarea>
    <div class="row" style="margin-top:16px"><button class="btn" type="submit">حفظ الطلب</button><a class="btn alt" href="#/orders">إلغاء</a></div>
  </form>`;
}

let q = '', filt = 'all';   // حالة البحث والفلترة
function pageOrders(){
  return `
  <h2>الطلبات</h2>
  <div class="card">
    <input id="q" placeholder="ابحثي باسم الزبون أو رقم الهاتف" value="${esc(q)}" oninput="q=this.value;renderList()">
    <div class="row" style="margin-top:10px" id="chips"></div>
  </div>
  <div id="list"></div>`;
}
function renderList(){
  const s = q.trim().toLowerCase();
  const res = orders.filter(o => (filt==='all'||o.status===filt) && (!s || o.name.toLowerCase().includes(s) || o.phone.includes(s)))
                    .sort((a,b)=>b.date.localeCompare(a.date));
  $('chips').innerHTML = [['all','الكل',orders.length],...Object.entries(ST).map(([k,[t]])=>[k,t,count(k)])]
    .map(([k,t,n])=>`<button class="btn sm ${filt===k?'':'alt'}" onclick="filt='${k}';renderList()">${t} (${n})</button>`).join('');
  $('list').innerHTML = res.length ? res.map(o=>`
    <div class="card item">
      <a class="top" href="#/order/${o.id}"><b>${esc(o.name)}</b>${badge(o.status)}</a>
      <div class="sub">${esc(o.product)} × ${o.qty} · ${esc(o.wilaya)} · ${esc(o.phone)}</div>
      <div class="between" style="margin-top:8px"><b style="color:var(--pink-d)">${fmt(total(o))} ${CUR}</b>
        <div class="row"><a class="btn alt sm" href="#/order/${o.id}">تفاصيل</a><a class="btn alt sm" href="#/edit/${o.id}">تعديل</a><button class="btn del sm" onclick="delOrder('${o.id}')">حذف</button></div></div>
    </div>`).join('') : '<div class="card empty">لا توجد نتائج</div>';
}

function pageDetail(id){
  const o = find(id);
  if(!o) return '<div class="empty">الطلب غير موجود</div>';
  const profit = o.cost>0 ? (o.price-o.cost)*o.qty : null;
  return `
  <div class="between"><h2>تفاصيل الطلب</h2>${badge(o.status)}</div>
  <div class="card"><dl>
    <dt>الزبون</dt><dd>${esc(o.name)}</dd>
    <dt>الهاتف</dt><dd><a href="tel:${esc(o.phone)}" style="color:var(--pink-d)">${esc(o.phone)}</a></dd>
    <dt>الولاية</dt><dd>${esc(o.wilaya)}</dd>
    <dt>العنوان</dt><dd>${esc(o.address)||'—'}</dd>
    <dt>المنتج</dt><dd>${esc(o.product)}</dd>
    <dt>الكمية</dt><dd>${o.qty}</dd>
    <dt>سعر المنتج</dt><dd>${fmt(o.price)} ${CUR}</dd>
    <dt>التوصيل</dt><dd>${fmt(o.delivery)} ${CUR}</dd>
    <dt>الإجمالي</dt><dd><b>${fmt(total(o))} ${CUR}</b></dd>
    ${profit!==null?`<dt>الربح</dt><dd>${fmt(profit)} ${CUR}</dd>`:''}
    <dt>ملاحظات</dt><dd>${esc(o.notes)||'—'}</dd>
    <dt>التاريخ</dt><dd>${fdate(o.date)}</dd>
  </dl></div>
  <div class="card"><h3>تغيير الحالة</h3><div class="row">
    ${Object.entries(ST).map(([k,[t]])=>`<button class="btn sm ${o.status===k?'':'alt'}" ${o.status===k?'disabled':''} onclick="setStatus('${o.id}','${k}')">${t}</button>`).join('')}
  </div></div>
  <div class="row"><a class="btn" href="#/edit/${o.id}">تعديل</a><button class="btn del" onclick="delOrder('${o.id}',true)">حذف</button><a class="btn alt" href="#/orders">رجوع</a></div>`;
}

function pageStats(){
  const ok = orders.filter(o=>o.status==='confirmed');
  const sales = ok.reduce((s,o)=>s+total(o),0);
  const withCost = ok.filter(o=>o.cost>0);
  const profit = withCost.reduce((s,o)=>s+(o.price-o.cost)*o.qty,0);
  const rate = orders.length ? Math.round(count('canceled')/orders.length*100) : 0;
  const tops = {};
  orders.filter(o=>o.status!=='canceled').forEach(o=>tops[o.product]=(tops[o.product]||0)+o.qty);
  const top = Object.entries(tops).sort((a,b)=>b[1]-a[1]).slice(0,5), mx = top.length?top[0][1]:1;
  const days = [...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d});
  const vals = days.map(d=>ok.filter(o=>new Date(o.date).toDateString()===d.toDateString()).reduce((s,o)=>s+total(o),0));
  const m = Math.max(...vals,1);
  const svg = `<svg viewBox="0 0 350 160" class="chart">${vals.map((v,i)=>{const h=v/m*100;
    return `<rect x="${i*50+8}" y="${120-h}" width="34" height="${Math.max(h,2)}" rx="8" fill="#d9768f"/><text x="${i*50+25}" y="145" text-anchor="middle" font-size="12" fill="#8a7a7e">${days[i].getDate()}/${days[i].getMonth()+1}</text>`}).join('')}</svg>`;
  return `
  <h2>الإحصائيات</h2>
  <div class="grid">
    <div class="card stat"><div class="n">${orders.length}</div><div class="l">عدد الطلبات</div></div>
    <div class="card stat"><div class="n">${rate}%</div><div class="l">نسبة الملغاة</div></div>
    <div class="card stat"><div class="n">${fmt(sales)}</div><div class="l">إجمالي المبيعات (${CUR})</div></div>
    <div class="card stat"><div class="n">${withCost.length?fmt(profit):'—'}</div><div class="l">الأرباح (${CUR})</div></div>
  </div>
  <div class="card"><h3>مبيعات آخر 7 أيام (المؤكدة)</h3>${svg}</div>
  <div class="card"><h3>أكثر المنتجات طلباً</h3>
  ${top.length ? top.map(([n,c])=>`<div class="bar"><div class="between"><span>${esc(n)}</span><b>${c}</b></div><i style="width:${c/mx*100}%"></i></div>`).join('') : '<div class="empty">لا بيانات</div>'}</div>`;
}

/* ===== 5) الأفعال: حفظ، حذف، تغيير الحالة ===== */
async function saveOrder(e,id){
  e.preventDefault();
  const f = new FormData(e.target), g = k => (f.get(k)||'').toString().trim();
  const data = {name:g('name'),phone:g('phone'),wilaya:g('wilaya'),address:g('address'),product:g('product'),
    qty:Math.max(1,+g('qty')||1),price:+g('price')||0,delivery:+g('delivery')||0,cost:+g('cost')||0,notes:g('notes'),status:g('status')};
  try{
    if(id){ await DB.update(id,data); location.hash='#/order/'+id; }
    else { const nid = await DB.add({...data,date:new Date().toISOString()}); location.hash='#/order/'+nid; }
  }catch(x){ alert('تعذّر الحفظ، تأكدي من الاتصال'); }
  return false;
}
async function delOrder(id,goList){
  if(!confirm('هل تريدين حذف هذا الطلب نهائياً؟')) return;
  try{ await DB.del(id); if(goList) location.hash='#/orders'; }catch(x){ alert('تعذّر الحذف'); }
}
async function setStatus(id,s){ try{ await DB.update(id,{status:s}); }catch(x){ alert('تعذّر التحديث'); } }
function loginPage(){ return `<h2>دخول البائع</h2><form class="card" onsubmit="return doLogin(event)">
  <label>البريد الإلكتروني</label><input name="e" type="email" required>
  <label>كلمة السر</label><input name="p" type="password" required>
  <div id="err" style="color:var(--bad);font-size:13px;margin-top:8px"></div>
  <button class="btn" style="margin-top:12px">دخول</button></form>`; }
async function doLogin(e){ e.preventDefault(); const f=new FormData(e.target);
  try{ await DB.login(f.get('e'),f.get('p')); }catch(x){ $('err').textContent='البريد أو كلمة السر غير صحيحة'; } return false; }

/* ===== 6) التوجيه: الرابط بعد # يحدد الصفحة ===== */
function route(){
  if(!ready){ $('app').innerHTML='<div class="empty">جارٍ التحميل…</div>'; return; }
  if(!user){ $('nav').innerHTML=''; $('app').innerHTML=loginPage(); return; }
  const [p,id] = (location.hash.slice(2)||'').split('/');
  const pages = {'':pageDashboard,new:()=>pageForm(),edit:()=>pageForm(id),orders:pageOrders,order:()=>pageDetail(id),stats:pageStats};
  $('app').innerHTML = (pages[p]||pageDashboard)();
  if(p==='orders') renderList();
  const on = p==='new'||p==='edit'?'new':p==='order'?'orders':p;
  $('nav').innerHTML = [['','🏠','الرئيسية'],['orders','📋','الطلبات'],['new','➕','إضافة'],['stats','📊','الإحصائيات']]
    .map(([h,i,t])=>`<a href="#/${h}" class="${on===h?'on':''}"><b>${i}</b>${t}</a>`).join('');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeraZUAeX2nqTrzGBxU5NQEioyQ4vx38Y",
  authDomain: "rderflow-ba3af.firebaseapp.com",
  projectId: "rderflow-ba3af",
  storageBucket: "rderflow-ba3af.firebasestorage.app",
  messagingSenderId: "520695536117",
  appId: "1:520695536117:web:a848469f6013c21d6ca8bc"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
let unsub = null;
window.DB = {
  login: (e,p) => signInWithEmailAndPassword(auth,e,p),
  logout: () => signOut(auth),
  add: async d => { const ref = doc(collection(db,'orders')); await setDoc(ref,{...d,status:'pending'});
    if(d.status!=='pending') await updateDoc(ref,{status:d.status}); return ref.id; },
  update: (id,d) => updateDoc(doc(db,'orders',id),d),
  del: id => deleteDoc(doc(db,'orders',id))
};
onAuthStateChanged(auth, u => {
  if(unsub){ unsub(); unsub=null; }
  if(u) unsub = onSnapshot(collection(db,'orders'), snap => onOrders(snap.docs.map(d=>({id:d.id,...d.data()}))), err => alert('خطأ في قراءة الطلبات: '+err.code));
  else onOrders([]);
  onAuth(u);
});
</script>
</body>
</html>
